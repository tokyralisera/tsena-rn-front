<div class="toast toast-top toast-end z-[9999]">
  <div 
    *ngFor="let notification of notifications" 
    class="alert shadow-lg mb-3 min-w-[320px] max-w-md"
    [ngClass]="getAlertClass(notification.type)"
    [@slideIn]
  >
    <div class="flex items-start w-full">
      <!-- Icône -->
      <div class="flex-shrink-0" [innerHTML]="getIcon(notification.type)"></div>
      
      <!-- Contenu -->
      <div class="flex-1 ml-3">
        <div class="font-bold text-sm">{{ notification.title }}</div>
        <div class="text-xs mt-1 opacity-90">{{ notification.message }}</div>
      </div>
      
      <!-- Bouton fermer -->
      <button 
        *ngIf="notification.dismissible"
        class="btn btn-sm btn-ghost btn-circle ml-2 flex-shrink-0"
        (click)="dismiss(notification.id)"
        aria-label="Fermer la notification"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
</div>
