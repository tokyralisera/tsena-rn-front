<div class="w-full p-6">
  <div class="max-w-4xl mx-auto">
    <!-- En-tête -->
    <div class="mb-8">
      <h1 class="text-4xl font-extrabold text-primary">Mon Compte</h1>
      <p class="text-base text-gray-500 mt-2">Gérez vos informations personnelles</p>
    </div>

    <!-- Carte principale -->
    <div class="card bg-base-100 shadow-xl border border-gray-200">
      <div class="card-body p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="card-title text-2xl text-gray-800">Informations personnelles</h2>
          <div class="flex gap-2">
            <button 
              *ngIf="!isEditing"
              (click)="toggleEdit()"
              class="btn btn-primary btn-sm"
              [disabled]="isLoading">
              <span class="mr-1">✏️</span> Modifier
            </button>
            <div *ngIf="isEditing" class="flex gap-2">
              <button 
                (click)="cancelEdit()"
                class="btn btn-outline btn-sm"
                [disabled]="isLoading">
                <span class="mr-1">❌</span> Annuler
              </button>
              <button 
                (click)="onSubmit()"
                [disabled]="accountForm.invalid || isLoading"
                class="btn btn-success btn-sm">
                <span *ngIf="!isLoading">✅ Enregistrer</span>
                <span *ngIf="isLoading" class="loading loading-spinner loading-xs"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Loading -->
        <div *ngIf="isLoading" class="flex flex-col items-center py-12">
          <span class="loading loading-spinner loading-lg text-primary"></span>
          <p class="mt-4 text-gray-500 font-medium">Chargement de vos informations...</p>
        </div>

        <!-- Formulaire -->
        <form [formGroup]="accountForm" *ngIf="!isLoading && currentUser" class="space-y-8">
          <!-- Section Informations de base -->
          <div>
            <h3 class="text-lg font-semibold text-gray-700 mb-4 pb-2 border-b border-gray-200">
              Informations de base
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- Nom -->
              <div class="form-control w-full">
                <label class="label">
                  <span class="label-text font-medium text-gray-700">Nom *</span>
                </label>
                <input 
                  type="text" 
                  class="input input-bordered w-full"
                  formControlName="nomUtilisateur"
                  [readonly]="!isEditing"
                  [class.input-disabled]="!isEditing"
                  [class.input-error]="accountForm.get('nomUtilisateur')?.invalid && accountForm.get('nomUtilisateur')?.touched"
                  placeholder="Votre nom">
                <label class="label">
                  <span *ngIf="accountForm.get('nomUtilisateur')?.invalid && accountForm.get('nomUtilisateur')?.touched" class="label-text-alt text-error">
                    <span *ngIf="accountForm.get('nomUtilisateur')?.errors?.['required']">Le nom est requis</span>
                    <span *ngIf="accountForm.get('nomUtilisateur')?.errors?.['minlength']">Minimum 2 caractères</span>
                  </span>
                </label>
              </div>

              <!-- Prénom -->
              <div class="form-control w-full">
                <label class="label">
                  <span class="label-text font-medium text-gray-700">Prénom *</span>
                </label>
                <input 
                  type="text" 
                  class="input input-bordered w-full"
                  formControlName="prenomUtilisateur"
                  [readonly]="!isEditing"
                  [class.input-disabled]="!isEditing"
                  [class.input-error]="accountForm.get('prenomUtilisateur')?.invalid && accountForm.get('prenomUtilisateur')?.touched"
                  placeholder="Votre prénom">
                <label class="label">
                  <span *ngIf="accountForm.get('prenomUtilisateur')?.invalid && accountForm.get('prenomUtilisateur')?.touched" class="label-text-alt text-error">
                    <span *ngIf="accountForm.get('prenomUtilisateur')?.errors?.['required']">Le prénom est requis</span>
                    <span *ngIf="accountForm.get('prenomUtilisateur')?.errors?.['minlength']">Minimum 2 caractères</span>
                  </span>
                </label>
              </div>

              <!-- Genre -->
              <div class="form-control w-full">
                <label class="label">
                  <span class="label-text font-medium text-gray-700">Genre *</span>
                </label>
                <select 
                  class="select select-bordered w-full"
                  formControlName="genre"
                  [disabled]="!isEditing"
                  [class.select-error]="accountForm.get('genre')?.invalid && accountForm.get('genre')?.touched">
                  <option value="">Sélectionnez votre genre</option>
                  <option *ngFor="let genre of sexeOptions" [value]="genre.value">{{ genre.label }}</option>
                </select>
              </div>

              <!-- Langue -->
              <div class="form-control w-full">
                <label class="label">
                  <span class="label-text font-medium text-gray-700">Langue *</span>
                </label>
                <select 
                  class="select select-bordered w-full"
                  formControlName="langue"
                  [disabled]="!isEditing">
                  <option *ngFor="let langue of langueOptions" [value]="langue.value">{{ langue.label }}</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Section Informations professionnelles -->
          <div>
            <h3 class="text-lg font-semibold text-gray-700 mb-4 pb-2 border-b border-gray-200">
              Informations professionnelles
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- NIF -->
              <div class="form-control w-full">
                <label class="label">
                  <span class="label-text font-medium text-gray-700">NIF *</span>
                </label>
                <input 
                  type="text" 
                  class="input input-bordered input-disabled w-full"
                  formControlName="NIF"
                  readonly
                  placeholder="Votre NIF">
                <label class="label">
                  <span class="label-text-alt text-gray-500">Le NIF ne peut pas être modifié</span>
                </label>
              </div>

              <!-- STAT -->
              <div class="form-control w-full">
                <label class="label">
                  <span class="label-text font-medium text-gray-700">STAT</span>
                </label>
                <input 
                  type="text" 
                  class="input input-bordered w-full"
                  formControlName="STAT"
                  [readonly]="!isEditing"
                  [class.input-disabled]="!isEditing"
                  placeholder="Votre STAT (optionnel)">
              </div>
            </div>
          </div>

          <!-- Informations non modifiables -->
          <div class="alert alert-info mt-8">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <div>
              <h3 class="font-bold">Informations non modifiables</h3>
              <div class="text-xs">
                Rôle: <span class="font-semibold">{{ currentUser.role }}</span> • 
                Téléphone: <span class="font-semibold">{{ currentUser.telephone }}</span>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
