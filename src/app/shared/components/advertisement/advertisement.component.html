<aside class="fixed right-0 top-16 bottom-0 w-80 bg-gradient-to-b from-base-100 to-base-200 border-l border-base-300 overflow-y-auto">
  <div class="p-6 space-y-8">
    <!-- Nos Partenaires Section -->
    <section class="space-y-4">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <h2 class="text-lg font-bold text-base-content">Nos Partenaires</h2>
      </div>
      
      <div class="space-y-3">
        @for (partner of partners(); track partner.id) {
          <div 
            class="card bg-base-100 shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer group border border-base-300 hover:border-primary"
            [class.hover:-translate-y-1]="partner.website"
            (click)="onPartnerClick(partner)"
            role="button"
            [attr.tabindex]="partner.website ? 0 : null"
            [attr.aria-label]="'Visitez ' + partner.name">
            
            <div class="card-body p-4 text-center">
              <div class="avatar mx-auto mb-3">
                <div [class]="'w-16 h-16 rounded-full ' + partner.bgColor + ' flex items-center justify-center ring-2 ring-base-300 group-hover:ring-primary transition-all'">
                  @if (partner.logo) {
                    <img 
                      [src]="partner.logo" 
                      [alt]="partner.name + ' logo'" 
                      class="w-8 h-8 object-contain"
                      loading="lazy"
                      (error)="onImageError($event)">
                  } @else {
                    <span class="text-2xl font-bold text-base-content/60">
                      {{ partner.name.charAt(0) }}
                    </span>
                  }
                </div>
              </div>
              
              <h3 class="card-title text-sm justify-center font-semibold text-base-content group-hover:text-primary transition-colors">
                {{ partner.name }}
              </h3>
              
              <p class="text-xs text-base-content/70 leading-relaxed">
                {{ partner.description }}
              </p>

              @if (partner.website) {
                <div class="flex items-center justify-center gap-1 text-xs text-primary opacity-0 group-hover:opacity-100 transition-opacity mt-2">
                  <span>Visiter le site</span>
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                  </svg>
                </div>
              }
            </div>
          </div>
        }
      </div>
    </section>

    <!-- Divider -->
    <div class="divider my-6"></div>

    <!-- Publicité Section -->
    <section class="space-y-4">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
        </svg>
        <h2 class="text-lg font-bold text-base-content">Publicité</h2>
      </div>
    </section>

    <!-- Footer Info -->
    <div class="text-center pt-4 pb-2">
      <p class="text-s text-base-content/50">
        Vous souhaitez devenir partenaire ?
      </p>
      <a href="/contact" class="link link-primary link-hover text-s font-medium">
        Contactez-nous
      </a>
    </div>
  </div>
</aside>
