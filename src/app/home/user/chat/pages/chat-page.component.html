<div class="h-screen flex flex-col bg-base-200">
  <!-- Top Bar -->
  <div class="bg-gradient-to-r from-primary to-secondary text-primary-content shadow-lg flex-shrink-0">
    <div class="container mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button 
            class="btn btn-ghost btn-sm md:hidden"
            [class.hidden]="!showChatWindow"
            (click)="onBackToList()"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <h1 class="text-2xl font-bold flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
            Messagerie
          </h1>
        </div>

        <!-- Connection Status -->
        <div class="flex items-center gap-2">
          @if (isConnected) {
            <div class="flex items-center gap-2 badge badge-success badge-sm">
              <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-success-content"></span>
              </span>
              En ligne
            </div>
          } @else {
            <div class="badge badge-error badge-sm">
              Hors ligne
            </div>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 overflow-hidden" style="min-height: 0;">
    <div class="h-full">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-0 h-full">
        <!-- Chat List -->
        <div 
          class="col-span-1 md:col-span-4 border-r border-base-300 h-full overflow-hidden"
          [class.hidden]="showChatWindow"
          [class.block]="!showChatWindow"
        >
          <app-chat-list 
            (conversationSelected)="onConversationSelected($event)"
          ></app-chat-list>
        </div>

        <!-- Chat Window -->
        <div 
          class="col-span-1 md:col-span-8 h-full overflow-hidden"
          [class.hidden]="!showChatWindow && !activeConversation()"
          [class.block]="showChatWindow || activeConversation()"
        >
          <app-chat-window></app-chat-window>
        </div>
      </div>
    </div>
  </div>
</div>
