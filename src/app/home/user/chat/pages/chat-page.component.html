<div class="page-container">
  <!-- En-tête moderne -->
  <div class="page-header-modern">
    <div class="header-left">
      <!-- Bouton retour mobile -->
      <button 
        class="btn-back-mobile"
        [class.visible]="showChatWindow"
        (click)="onBackToList()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <div class="header-content">
        <h1 class="page-title-modern">Messagerie</h1>
        <p class="page-subtitle">Gérez vos conversations en temps réel</p>
      </div>
    </div>

    <div class="header-actions-modern">
      <!-- Status de connexion -->
      @if (isConnected) {
        <div class="status-badge online">
          <span class="status-indicator">
            <span class="status-ping"></span>
            <span class="status-dot"></span>
          </span>
          <span class="status-text">En ligne</span>
        </div>
      } @else {
        <div class="status-badge offline">
          <span class="status-indicator">
            <span class="status-dot"></span>
          </span>
          <span class="status-text">Hors ligne</span>
        </div>
      }
    </div>
  </div>

  <!-- Conteneur principal -->
  <div class="content-container">
    <div class="chat-layout">
      <div class="chat-grid">
        <!-- Liste des conversations -->
        <div 
          class="chat-sidebar"
          [class.mobile-hidden]="showChatWindow">
          <app-chat-list 
            (conversationSelected)="onConversationSelected($event)">
          </app-chat-list>
        </div>

        <!-- Fenêtre de chat -->
        <div 
          class="chat-main"
          [class.mobile-hidden]="!showChatWindow && !activeConversation()"
          [class.mobile-visible]="showChatWindow || activeConversation()">
          <app-chat-window></app-chat-window>
        </div>
      </div>
    </div>
  </div>
</div>
